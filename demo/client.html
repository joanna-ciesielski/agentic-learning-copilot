<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentic-learning-copilot — streaming demo</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171d24; --edge: #2a3441; --text: #d6dde6;
    --dim: #7d8b9c; --accent: #4da3ff; --ok: #3ecf8e; --bad: #ff6b6b; --warn: #ffb454;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { max-width: 980px; margin: 0 auto; padding: 1.2rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .2rem; font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
  input, select, button { background: var(--panel); color: var(--text); border: 1px solid var(--edge); border-radius: 6px; padding: .45rem .6rem; font: inherit; }
  input:focus { outline: 1px solid var(--accent); }
  #query { flex: 1; min-width: 240px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #14304d; border-color: var(--accent); }
  .hud { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: .5rem; margin: .8rem 0; }
  .stat { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: .5rem .65rem; }
  .stat b { display: block; font-size: 1.25rem; font-weight: 600; }
  .stat span { color: var(--dim); font-size: .78rem; }
  .stat.alert b { color: var(--bad); }
  #answerPanel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: .8rem 1rem; min-height: 7rem; max-height: 16rem; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  #meta { color: var(--dim); font-size: .82rem; margin-top: .5rem; min-height: 1.2em; }
  .badge { display: inline-block; border-radius: 5px; padding: .1rem .5rem; font-size: .8rem; margin-left: .4rem; }
  .badge.ok { background: #103526; color: var(--ok); }
  .badge.bad { background: #3b1518; color: var(--bad); }
  .badge.warn { background: #3a2c12; color: var(--warn); }
  fieldset { border: 1px solid var(--edge); border-radius: 8px; margin: .8rem 0; padding: .6rem .8rem; }
  legend { color: var(--dim); font-size: .8rem; padding: 0 .4rem; }
  label { color: var(--dim); font-size: .85rem; }
  #log { color: var(--dim); font-size: .78rem; max-height: 8rem; overflow-y: auto; margin-top: .6rem; }
</style>
</head>
<body>
<main>
  <h1>agentic-learning-copilot <small>— SSE streaming demo · contract v1.0 · no build step, no dependencies</small></h1>

  <div class="row">
    <input id="query" value="explain photosynthesis" placeholder="ask the copilot">
    <select id="org"><option>acme</option><option>globex</option><option>meydan</option></select>
    <button id="ask" class="primary">Ask</button>
    <button id="drop" disabled>Drop connection</button>
    <button id="resume" disabled>Resume (Last-Event-ID)</button>
  </div>

  <div class="hud">
    <div class="stat"><b id="sTok">0</b><span>tokens/sec</span></div>
    <div class="stat"><b id="sEvt">0</b><span>events/sec</span></div>
    <div class="stat"><b id="sFps">—</b><span>fps</span></div>
    <div class="stat"><b id="sFrame">—</b><span>frame ms</span></div>
    <div class="stat" id="dropStat"><b id="sDropped">0</b><span>dropped frames</span></div>
    <div class="stat"><b id="sPending">0</b><span>pending buffer</span></div>
    <div class="stat"><b id="sSeq">—</b><span>last seq</span></div>
  </div>

  <div id="answerPanel"></div>
  <div id="meta"></div>

  <fieldset>
    <legend>PATTERN 6 — stress mode (synthetic events, transport only)</legend>
    <div class="row">
      <label>rate <input id="rate" type="range" min="1000" max="5000" step="500" value="3000">
        <span id="rateVal">3000</span>/s</label>
      <label>count <input id="count" type="number" value="20000" min="1000" max="100000" step="1000" style="width:6.5rem"></label>
      <label><input id="batching" type="checkbox" checked> rAF batching</label>
      <button id="stress">Start stress</button>
      <button id="stopStress" disabled>Stop</button>
    </div>
  </fieldset>

  <div id="log"></div>
</main>

<script>
"use strict";
/*
 * Render-lag prevention under high-frequency streams — the six patterns this
 * file exists to teach, labeled where they live:
 *
 *   PATTERN 1  event ingestion decoupled from render (buffer + rAF flush)
 *   PATTERN 2  batched token coalescing (one string build, one DOM write/frame)
 *   PATTERN 3  monotonic seq handling + out-of-order guard
 *   PATTERN 4  reconnect/resume via Last-Event-ID
 *   PATTERN 5  latency HUD (tokens/sec, events/sec, frame time, dropped frames)
 *   PATTERN 6  stress mode (server streams 1–5k synthetic events/sec)
 *
 * The anti-pattern is also here on purpose: untick "rAF batching" during stress
 * and every event touches the DOM as it arrives — watch fps collapse. The
 * before/after IS the demo.
 */

const $ = (id) => document.getElementById(id);
const log = (msg) => {
  const line = document.createElement("div");
  line.textContent = `${new Date().toISOString().slice(11, 19)} ${msg}`;
  $("log").prepend(line);
};

/* ---------------------------------------------------------------- state -- */

const state = {
  buffer: [],          // PATTERN 1: ingestion writes HERE, never to the DOM
  pendingText: "",     // PATTERN 2: coalesced token text awaiting one DOM write
  lastSeq: 0,          // PATTERN 3: monotonic cursor
  lastEventId: 0,      // PATTERN 4: resume cursor (replayable events only)
  nextTokenIndex: 0,   // PATTERN 3: contiguous-index gap detector
  outOfOrder: 0,
  threadId: null,
  aborter: null,
  streaming: false,
  stressing: false,
  // PATTERN 5 counters
  tokensInWindow: 0, eventsInWindow: 0, droppedFrames: 0,
  answerBytes: 0, sha: null, tokenTexts: [],
};

const answerNode = document.createTextNode("");
$("answerPanel").appendChild(answerNode);
const MAX_VISIBLE_CHARS = 4000; // stress mode: bound the DOM so layout cost stays
                                // constant and the HUD measures event handling,
                                // not an ever-growing text node

/* ------------------------------------------------- PATTERN 1 + 2: render -- */

let lastFrameTs = performance.now();
let frameEma = 16.7;

function renderLoop(now) {
  // PATTERN 5: frame time + dropped-frame accounting from real rAF deltas.
  const delta = now - lastFrameTs;
  lastFrameTs = now;
  frameEma = frameEma * 0.9 + delta * 0.1;
  // >2 vsync intervals = a visible hitch. Count the frames that SHOULD have
  // happened in the gap, not "1 per hitch" — a 5-second freeze is ~300 missed
  // frames, and a counter that says "1" for it would be lying.
  if (delta > 34) state.droppedFrames += Math.max(1, Math.round(delta / 16.7) - 1);
  // …but a BACKGROUND tab is not a freeze: browsers pause rAF entirely when
  // the tab is hidden, so that gap is invisibility, not jank. The
  // visibilitychange handler below resets the frame clock so it isn't booked.

  // PATTERN 1: drain everything that arrived since the last frame...
  const batch = state.buffer;
  if (batch.length > 0) {
    state.buffer = [];
    for (const event of batch) applyEvent(event);
  }
  // PATTERN 2: ...then commit the coalesced text in ONE DOM write, and scroll
  // ONCE per frame — not once per event.
  if (state.pendingText.length > 0) {
    let text = answerNode.data + state.pendingText;
    if (text.length > MAX_VISIBLE_CHARS) text = text.slice(-MAX_VISIBLE_CHARS);
    answerNode.data = text;
    state.pendingText = "";
    const panel = $("answerPanel");
    panel.scrollTop = panel.scrollHeight;
  }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

document.addEventListener("visibilitychange", () => {
  // Re-arm the frame clock when the tab becomes visible again, so time spent
  // hidden (rAF suspended by the browser) is never counted as dropped frames.
  lastFrameTs = performance.now();
});

/* ------------------------------------------------------- event handling -- */

function ingest(event) {
  // PATTERN 3: strictly-increasing seq. Heartbeats consume seq but carry no
  // id:, so the guard is ">" not "+1" — resumed streams legitimately skip.
  if (event.seq <= state.lastSeq) {
    state.outOfOrder++;
    return;
  }
  state.lastSeq = event.seq;
  if (event.type !== "heartbeat") state.lastEventId = event.seq; // PATTERN 4 cursor
  state.eventsInWindow++;

  if ($("batching").checked || !state.stressing) {
    state.buffer.push(event); // PATTERN 1: rendering happens on the next frame
  } else {
    // ANTI-PATTERN (deliberate): what naive streaming UIs actually do —
    // `innerHTML +=` re-serializes and RE-PARSES the panel on every event,
    // then an auto-scroll read forces synchronous layout on top. The panel is
    // trimmed so the per-event cost is high-but-bounded rather than quadratic:
    // untrimmed, a few thousand events tar-pit the tab for minutes, which
    // demonstrates nothing except a frozen page. This is what the batching
    // toggle demonstrates against under stress.
    applyEvent(event);
    if (state.pendingText) {
      const escaped = state.pendingText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      state.pendingText = "";
      const panel = $("answerPanel");
      panel.innerHTML += `<span>${escaped}</span>`;
      if (panel.innerHTML.length > 12_000) panel.innerHTML = panel.innerHTML.slice(-8_000);
      panel.scrollTop = panel.scrollHeight; // layout flush, per event
    }
  }
}

function applyEvent(event) {
  switch (event.type) {
    case "route":
      setMeta(`route: ${event.vertical} (confidence ${event.confidence}${event.viaFallback ? ", keyword fallback" : ""})`);
      break;
    case "citation":
      setMeta(`${$("meta").textContent} · ${event.citations.length} citation(s): ${event.citations.map((c) => c.title).join(" · ")}`);
      break;
    case "token":
      // PATTERN 3: contiguous token.index is the answer's own gap detector,
      // independent of seq (which counts every event type).
      if (event.index !== state.nextTokenIndex) badge("meta", `token gap at ${event.index}`, "bad");
      state.nextTokenIndex = event.index + 1;
      state.pendingText += event.text; // PATTERN 2: string-builder, no DOM here
      state.tokensInWindow++;
      state.tokenTexts.push(event.text);
      break;
    case "note":
      log(`note: ${event.note}`);
      break;
    case "usage":
      log(`usage: ${event.usage.totalTokens} tokens, $${event.usage.costUsd.toFixed(6)}, ${event.usage.calls} call(s)`);
      break;
    case "done":
      verifyParity(event);
      finishStream(`done · ${event.tokenCount} tokens`);
      break;
    case "error":
      badge("meta", `${event.code}${event.partial ? " (partial)" : ""}`, event.code === "RESUME_GAP" ? "warn" : "bad");
      log(`error: ${event.code} — ${event.message}`);
      finishStream(`error · ${event.code}`);
      break;
    case "heartbeat":
      log("heartbeat");
      break;
  }
}

/** The done event carries sha256/byte witnesses so the CLIENT can prove the
 *  parity invariant instead of trusting it (contract §3). Red badge = broken. */
async function verifyParity(done) {
  const text = state.tokenTexts.join("");
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  const hex = [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
  const ok = hex === done.answerSha256 && bytes.length === done.answerBytes;
  badge("meta", ok ? "PARITY OK" : "PARITY FAIL", ok ? "ok" : "bad");
  if (!ok) log(`parity mismatch: ${bytes.length}B/${hex.slice(0, 12)}… vs ${done.answerBytes}B/${done.answerSha256.slice(0, 12)}…`);
}

/* ----------------------------------------------------- SSE over fetch ---- */
/* The endpoint is POST (a query body), so EventSource does not apply — this
 * is the hand-rolled reader half of PATTERN 4. */

async function readSse(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let tail = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    tail += decoder.decode(value, { stream: true });
    const frames = tail.split("\n\n");
    tail = frames.pop() ?? "";
    for (const frame of frames) {
      const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
      if (dataLine) onEvent(JSON.parse(dataLine.slice(6)));
    }
  }
}

async function startChat({ resumeFrom } = {}) {
  if (state.streaming) return;
  resetStream(resumeFrom === undefined);
  state.streaming = true;
  state.aborter = new AbortController();
  setButtons({ ask: false, drop: true, resume: false });

  const headers = { "content-type": "application/json" };
  if (resumeFrom !== undefined) {
    headers["last-event-id"] = String(resumeFrom); // PATTERN 4
    log(`resuming thread ${state.threadId} from seq ${resumeFrom}`);
  } else {
    state.threadId = `t-${Math.random().toString(36).slice(2, 10)}`;
  }

  try {
    const response = await fetch("/v1/chat", {
      method: "POST",
      headers,
      body: JSON.stringify({
        query: $("query").value,
        scope: { orgId: $("org").value, userId: "demo-user" },
        threadId: state.threadId,
      }),
      signal: state.aborter.signal,
    });
    if (!response.ok) {
      log(`HTTP ${response.status}: ${await response.text()}`);
      finishStream(`HTTP ${response.status}`);
      return;
    }
    await readSse(response, ingest);
  } catch (err) {
    if (state.aborter?.signal.aborted) {
      log("connection dropped by client — server aborts the run (no orphaned model calls)");
      finishStream("dropped");
      setButtons({ ask: true, drop: false, resume: true });
      return;
    }
    log(`stream failed: ${err.message}`);
    finishStream("network error");
  }
}

/* ------------------------------------------------ PATTERN 6: stress mode -- */

async function startStress() {
  if (state.streaming) return;
  resetStream(true);
  state.streaming = true;
  state.stressing = true;
  state.aborter = new AbortController();
  $("stress").disabled = true;
  $("stopStress").disabled = false;
  const rate = Number($("rate").value);
  const count = Number($("count").value);
  log(`stress: ${rate} events/sec × ${count}, batching ${$("batching").checked ? "ON" : "OFF"}`);

  try {
    const response = await fetch("/v1/stress", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ rate, count }),
      signal: state.aborter.signal,
    });
    await readSse(response, ingest);
  } catch {
    log("stress stream ended early");
  }
  state.stressing = false;
  finishStream("stress complete");
  $("stress").disabled = false;
  $("stopStress").disabled = true;
}

/* ------------------------------------------------------------- plumbing -- */

function resetStream(fresh) {
  if (fresh) {
    answerNode.data = "";
    $("answerPanel").replaceChildren(answerNode); // drop anti-pattern spans too
    $("meta").textContent = "";
    state.lastSeq = 0;
    state.lastEventId = 0;
    state.nextTokenIndex = 0;
    state.tokenTexts = [];
  }
  state.buffer = [];
  state.pendingText = "";
  state.outOfOrder = 0;
  state.droppedFrames = 0;
}

function finishStream(reason) {
  state.streaming = false;
  state.aborter = null;
  setMeta(`${$("meta").textContent} · ${reason}`);
  setButtons({ ask: true, drop: false, resume: true });
}

function setButtons({ ask, drop, resume }) {
  $("ask").disabled = !ask;
  $("drop").disabled = !drop;
  $("resume").disabled = !resume || state.lastEventId === 0;
}

function setMeta(text) { $("meta").childNodes[0]?.remove(); $("meta").prepend(document.createTextNode(text)); }
function badge(target, text, kind) {
  const b = document.createElement("span");
  b.className = `badge ${kind}`;
  b.textContent = text;
  $(target).appendChild(b);
}

/* PATTERN 5: the HUD samples on a fixed window, independent of both the
 * ingestion path and the render loop, so it stays honest when either stalls. */
setInterval(() => {
  $("sTok").textContent = String(state.tokensInWindow * 2);
  $("sEvt").textContent = String(state.eventsInWindow * 2);
  state.tokensInWindow = 0;
  state.eventsInWindow = 0;
  $("sFps").textContent = String(Math.min(60, Math.round(1000 / frameEma)));
  $("sFrame").textContent = frameEma.toFixed(1);
  $("sDropped").textContent = String(state.droppedFrames);
  $("dropStat").classList.toggle("alert", state.droppedFrames > 30);
  $("sPending").textContent = String(state.buffer.length);
  $("sSeq").textContent = state.lastSeq ? String(state.lastSeq) : "—";
}, 500);

/* -------------------------------------------------------------- wiring --- */

$("ask").addEventListener("click", () => startChat());
$("drop").addEventListener("click", () => state.aborter?.abort());
$("resume").addEventListener("click", () => startChat({ resumeFrom: state.lastEventId }));
$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") startChat(); });
$("stress").addEventListener("click", startStress);
$("stopStress").addEventListener("click", () => state.aborter?.abort());
$("rate").addEventListener("input", () => { $("rateVal").textContent = $("rate").value; });

log("ready — Ask streams a real turn; Drop + Resume demonstrates Last-Event-ID; stress mode hammers the render path");
</script>
</body>
</html>
